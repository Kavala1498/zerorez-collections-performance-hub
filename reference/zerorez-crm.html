<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zerorez Collections Performance Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f9;--sf:#fff;--tx:#14202b;--mu:#5b6b7a;--bd:#d9e1e8;--navy:#0b3a5e;--hl:#e8f0f7;
--s1:#8fbf8a;--s2:#f4b26e;--s3:#e8923a;--s4:#e06a6a;--s5:#c8412a;--st:#0b3a5e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--sf:#17222d;--tx:#e6edf3;--mu:#92a3b3;--bd:#2a3948;--hl:#1e3347;--s1:#5f9a5a;--s2:#c98a47;--s3:#bd6f22;--s4:#b84d4d;--s5:#a3321e}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Figtree,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:700}
header small{opacity:.75;display:block;font-weight:400}
nav{display:flex;gap:4px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;padding:6px 12px}
nav button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
nav button.on,.seg button.on{background:#fff;color:var(--navy);font-weight:600}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.k b{display:block;font-size:24px;font-weight:700;margin-top:2px}.k span{color:var(--mu);font-size:12.5px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.stack{display:flex;height:30px;border-radius:5px;overflow:hidden;margin-bottom:10px}
.stack div{display:flex;align-items:center;justify-content:center;color:#10202c;font-weight:600;font-size:12px;min-width:2px}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.leg div{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.leg i{width:12px;height:12px;border-radius:3px;flex:none;margin-top:3px}
.leg em{font-style:normal;color:var(--mu);display:block}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th{background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:8px 6px;text-align:center;vertical-align:bottom}
th small{display:block;font-weight:400;opacity:.8}
td{padding:6px;text-align:center;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
td.n{text-align:left;font-weight:600}
td.c{color:#10202c}td.c small{display:block;opacity:.8}
tbody tr{cursor:pointer}tbody tr:hover td.n,tr.sel td.n{background:var(--hl)}
td.t{background:var(--hl);font-weight:600}
tfoot td{font-weight:700;border-top:2px solid var(--navy);border-bottom:0}
.hint{color:var(--mu);font-size:12.5px;margin:8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row span:first-child{width:92px;font-size:12.5px;color:var(--mu)}
.row .b{height:16px;border-radius:3px;min-width:2px}.row .v{font-size:12.5px;font-weight:600}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
label{display:block;font-size:12.5px;color:var(--mu)}
select,input{width:100%;margin-top:3px;font:inherit;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx)}
.pri{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;display:none}
.pill{display:inline-block;background:var(--hl);border-radius:20px;padding:2px 10px;font-size:12px;margin-left:6px}
.shell{display:flex;min-height:100vh}.content{flex:1;min-width:0}
aside{width:232px;flex:none;background:#0a1626;color:#b9c7d6;padding:14px 10px 24px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;color:#fff;font-weight:700}
.brand b{width:32px;height:32px;border-radius:8px;background:#f5c542;color:#0a1626;display:grid;place-items:center;font-size:18px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:#7f93a7}
aside h3{font-size:11.5px;font-weight:600;color:#6f8397;margin:16px 8px 6px}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;border-radius:6px;color:inherit;padding:7px 8px;margin:1px 0}
.it:hover{background:#12233a}.it.on{background:#13263d;border-left-color:#f5c542;color:#fff;font-weight:600}
.it span{flex:1}.it i{width:8px;height:8px;border-radius:50%;flex:none}
.it em{font-style:normal;font-size:11.5px;color:#7f93a7;font-variant-numeric:tabular-nums}.it.on em{color:#f5c542}
header{background:var(--sf);color:var(--tx);border-bottom:1px solid var(--bd);justify-content:flex-start;padding:10px 20px}
header .crumb{color:var(--mu)}header .crumb b{color:var(--tx)}
#menu{display:none}
.drop{border:1.5px dashed var(--bd);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--hl)}.drop span{color:var(--mu);font-size:12.5px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.ins{margin:0;padding-left:18px}.ins li{margin:7px 0}
.by{margin:22px 8px 0;font-size:11.5px;color:#6f8397}.by2{margin-left:auto;font-size:12px;color:var(--mu)}
@media(max-width:560px){.by2{display:none}}
@media(max-width:820px){aside{position:fixed;top:0;bottom:0;left:0;height:auto;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .2s}.shell.open aside{transform:none}#menu{display:inline-block}}
</style>
</head>
<body>
<div class="shell">
<aside id="side"></aside>
<div class="content">
<header><button id="menu" aria-label="Menu">☰</button><div class="crumb">Zerorez Collections Performance Hub / <b id="crumb">Dashboard</b></div><span class="by2">Developed by Alejandro Torres</span></header>
<main id="app"></main>
</div></div>
<div class="toast" id="toast"></div>
<script>
const ST=[
 {k:'1–15 DPD',a:'Alejandro contacts the customer',c:'--s1'},
 {k:'16–30 DPD',a:'Alejandro contacts the BM',c:'--s2'},
 {k:'31–45 DPD',a:'BM contacts the customer',c:'--s3'},
 {k:'46–60 DPD',a:'ROM notified',c:'--s4'},
 {k:'Over 60 DPD',a:'Collection review with Kathryn',c:'--s5'}];
const D={
C:{BayArea:[4,5478.85,1,250,1,1077.5,1,2035.2,0,0],Dallas:[20,14821.25,20,16392.86,2,1806.41,3,1866.71,5,5406.09],Denver:[5,4932,5,8348.59,2,2308.05,0,0,1,1299],Indianapolis:[12,8199.92,5,7376.04,2,2599,0,0,2,794.88],Jacksonville:[10,18938.45,7,9816.97,6,7123.12,1,641.75,1,350],Minnesota:[28,34491.53,18,25234.74,7,3824.23,4,954.58,6,8639.3],Phoenix:[18,11191.09,10,6319.37,24,23350.28,10,4866.17,22,19155.11],Pittsburgh:[29,25389.49,7,5588,3,2160.91,2,483.75,47,145528.66],Raleigh:[10,4530.63,2,571.02,2,968.7,0,0,16,10185.28],SaltLakeCity:[3,1528.2,2,2345.2,0,0,0,0,0,510],SoCal:[4,13094.1,6,12776.76,5,9233.79,0,0,5,2916],Spokane:[16,18250.49,11,12237.01,12,7783.31,5,3275.5,3,1447],'St.Louis':[4,5336.85,2,775,0,0,1,375,15,8426.3],Tulsa:[2,1464.2,0,0,2,740,0,0,1,300]},
R:{BayArea:[0,0,0,0,1,250,0,0,2,894],Dallas:[0,0,0,0,1,129.9,1,2931.41,1,107.17],Denver:[0,0,0,0,1,159,0,0,0,0],Indianapolis:[0,0,0,0,1,139,0,0,0,0],Jacksonville:[0,0,0,0,0,0,0,0,1,240.35],Minnesota:[0,0,0,0,0,0,0,0,5,2101.95],Phoenix:[0,0,1,155,0,0,0,0,1,564],Pittsburgh:[0,0,0,0,0,0,1,460.1,2,487],Raleigh:[0,0,0,0,0,0,1,374,4,2766],SaltLakeCity:[2,858.41,0,0,0,0,0,0,4,2585.1],SoCal:[0,0,0,0,0,0,0,0,6,2133],Spokane:[0,0,0,0,0,0,0,0,1,594],'St.Louis':[0,0,0,0,0,0,0,0,3,1634.8],Tulsa:[0,0,0,0,0,0,0,0,4,1247]}};
const SAMPLE=JSON.parse(JSON.stringify(D));
const $=s=>document.querySelector(s);
const m=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>'$'+Math.round(n).toLocaleString('en-US');
let S={tab:'dash',seg:'T',loc:null};

function data(seg){
  const o={};
  Object.keys(D.C).forEach(l=>{
    const a=Array(10).fill(0);
    (seg==='T'?['C','R']:[seg]).forEach(g=>D[g][l].forEach((v,i)=>a[i]+=v));
    o[l]=a;
  });
  return o;
}
const sum=(a,i)=>a.reduce((s,v)=>s+v[i],0);
function totals(rows){
  const v=Object.values(rows),t=[];
  for(let i=0;i<10;i++)t.push(sum(v,i));
  return t;
}
function stageData(a){return ST.map((s,i)=>({...s,n:a[i*2],d:a[i*2+1]}))}

function nav(){
  const all=data('T');
  const tot=a=>stageData(a).reduce((s,x)=>s+x.d,0);
  const k=n=>'$'+(n>=10000?Math.round(n/1000):(n/1000).toFixed(1))+'k';
  const it=(t,l,loc,b,dot)=>`<button class="it ${S.tab===t&&(t!=='base'||S.loc===loc)?'on':''}" data-t="${t}" data-l="${loc||''}">${dot?`<i style="background:${dot}"></i>`:''}<span>${l}</span>${b?`<em>${b}</em>`:''}</button>`;
  $('#side').innerHTML=`<div class="brand"><b>z</b><div>Zerorez<small>Collections Hub</small></div></div>
   <h3>Platform</h3>${it('dash','Dashboard')}${it('load','Upload data')}
   <h3>Bases</h3>${Object.entries(all).map(([l,a])=>{const t=tot(a)||1,sh=(a[7]+a[9])/t;return it('base',l,l,k(t),sh>.5?'var(--s5)':sh>.2?'var(--s3)':'var(--s1)')}).join('')}<div class="by">Developed by Alejandro Torres</div>`;
  $('#side').querySelectorAll('.it').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;if(b.dataset.l)S.loc=b.dataset.l;$('.shell').classList.remove('open');render();window.scrollTo(0,0)});
  $('#crumb').textContent=S.tab==='base'?S.loc:S.tab==='load'?'Upload data':'Dashboard';
}
function seg(){
  return `<div class="seg">${[['T','All'],['C','Commercial'],['R','Residential']].map(([k,l])=>`<button class="${S.seg===k?'on':''}" data-s="${k}">${l}</button>`).join('')}</div>`;
}
function bindSeg(){document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.seg=b.dataset.s;render()})}

function dash(){
  const rows=data(S.seg),t=totals(rows),st=stageData(t);
  const acc=st.reduce((s,x)=>s+x.n,0),amt=st.reduce((s,x)=>s+x.d,0);
  const late=st[4].d+st[3].d;
  const worst=Object.entries(rows).map(([l,a])=>[l,stageData(a).reduce((s,x)=>s+x.d,0)]).sort((a,b)=>b[1]-a[1]);
  const sel=null;
  let h=`<div class="bar">${seg()}<span class="pill">${U.A.length?'Excel: '+esc(U.file)+' · cutoff '+U.cut:'Sample data'}</span></div>
  <div class="kpis">
   <div class="k"><span>Total past-due amount</span><b>${m0(amt)}</b></div>
   <div class="k"><span>Past-due accounts</span><b>${acc}</b></div>
   <div class="k"><span>Over 45 days (critical stage)</span><b>${m0(late)}</b><span>${(late/amt*100).toFixed(1)}% of portfolio</span></div>
   <div class="k"><span>Highest-balance base</span><b>${worst[0][0]}</b><span>${m0(worst[0][1])}</span></div>
  </div>
  ${insCard(U.A.filter(a=>a.st>0&&(S.seg==='T'||a.seg===S.seg)),'Portfolio insights',1)}
  <div class="card"><h2>Portfolio by delinquency stage</h2>
   <div class="stack">${st.map(x=>`<div style="width:${x.d/amt*100}%;background:var(${x.c})">${x.d/amt>.06?(x.d/amt*100).toFixed(1)+'%':''}</div>`).join('')}</div>
   <div class="leg">${st.map(x=>`<div><i style="background:var(${x.c})"></i><div><b>${x.k}</b> · ${m0(x.d)}<em>${x.a}</em></div></div>`).join('')}</div>
  </div>
  <div class="card"><h2>Detail by base</h2><div class="wrap"><table>
   <thead><tr><th style="text-align:left">Base</th>${ST.map(x=>`<th style="background:var(${x.c});color:#10202c">${x.k}<small>accounts · amount</small></th>`).join('')}<th>Total accounts</th><th>Total amount</th></tr></thead>
   <tbody>${Object.entries(rows).map(([l,a])=>{
     const s=stageData(a);
     return `<tr data-l="${l}" class=""><td class="n">${l}</td>${s.map(x=>`<td class="c" style="background:color-mix(in srgb,var(${x.c}) 55%,var(--sf))">${x.n}<small>${m(x.d)}</small></td>`).join('')}<td class="t">${s.reduce((q,x)=>q+x.n,0)}</td><td class="t">${m(s.reduce((q,x)=>q+x.d,0))}</td></tr>`}).join('')}</tbody>
   <tfoot><tr><td class="n">Total</td>${st.map(x=>`<td>${x.n}<br>${m(x.d)}</td>`).join('')}<td>${acc}</td><td>${m(amt)}</td></tr></tfoot>
  </table></div><p class="hint">Click a base to open its analytics.</p></div>`;
  if(sel){
    const s=stageData(sel),tot=s.reduce((q,x)=>q+x.d,0),mx=Math.max(...s.map(x=>x.d),1);
    h+=`<div class="card"><h2>${S.loc} · ${m(tot)} vencidos</h2><div class="two"><div>
      ${s.map(x=>`<div class="row"><span>${x.k}</span><span class="b" style="width:${x.d/mx*55}%;background:var(${x.c})"></span><span class="v">${m0(x.d)}</span></div>`).join('')}
     </div><div><b>Siguiente acción</b><p style="margin:6px 0 0">${s[4].n?`${s[4].n} cuentas en revisión de cobranza (${m0(s[4].d)}). Prioridad alta.`:s[3].n?`${s[3].n} cuentas con el ROM notificado.`:'Sin cuentas en etapas críticas.'}</p></div></div></div>`;
  }
  return h;
}

function base(){
  const l=S.loc,all=data('T'),T=a=>stageData(a).reduce((s,x)=>s+x.d,0),N=a=>stageData(a).reduce((s,x)=>s+x.n,0);
  const a=all[l],st=stageData(a),amt=T(a),acc=N(a),co=Object.values(all).reduce((s,v)=>s+T(v),0);
  const rank=Object.entries(all).map(([k,v])=>[k,T(v)]).sort((x,y)=>y[1]-x[1]),pos=rank.findIndex(r=>r[0]===l)+1;
  const crit=st[3].d+st[4].d;
  const cell=(t,g)=>{const s=stageData(D[g][l]),mx=Math.max(...s.map(x=>x.d),1);return `<div class="card"><h2>${t} · ${m0(T(D[g][l]))} <span class="pill">${N(D[g][l])} accounts</span></h2>${s.map(x=>`<div class="row"><span>${x.k}</span><span class="b" style="width:${x.d/mx*50}%;background:var(${x.c})"></span><span class="v">${m0(x.d)} · ${x.n}</span></div>`).join('')}</div>`};
  return `<div class="bar"><h2 style="margin:0;font-size:20px">${l}</h2><span class="pill">Rank ${pos} of 14 by past-due amount</span></div>
  <div class="kpis">
   <div class="k"><span>Past-due amount</span><b>${m0(amt)}</b></div>
   <div class="k"><span>Past-due accounts</span><b>${acc}</b></div>
   <div class="k"><span>Average per account</span><b>${m0(amt/(acc||1))}</b></div>
   <div class="k"><span>Share of company total</span><b>${(amt/co*100).toFixed(1)}%</b></div>
   <div class="k"><span>Over 45 days</span><b>${(crit/(amt||1)*100).toFixed(0)}%</b><span>${m0(crit)}</span></div>
  </div>
  ${insCard(U.A.filter(a=>a.st>0&&a.base===l),'Insights for '+l)}
  <div class="card"><h2>Stage distribution</h2>
   <div class="stack">${st.map(x=>`<div style="width:${x.d/(amt||1)*100}%;background:var(${x.c})">${x.d/(amt||1)>.07?(x.d/amt*100).toFixed(0)+'%':''}</div>`).join('')}</div>
   <div class="leg">${st.map(x=>`<div><i style="background:var(${x.c})"></i><div><b>${x.k}</b> · ${m0(x.d)} · ${x.n} accounts<em>${x.a}</em></div></div>`).join('')}</div>
  </div>
  <div class="two">${cell('Commercial','C')}${cell('Residential','R')}</div>
  ${acctCard(l)}<div class="card"><h2>Comparison across bases</h2>${rank.map(([k,v])=>`<div class="row" data-go="${k}" style="cursor:pointer"><span>${k}</span><span class="b" style="width:${v/rank[0][1]*60}%;${k===l?'background:#f5c542':'background:var(--mu);opacity:.35'}"></span><span class="v">${m0(v)}</span></div>`).join('')}</div>`;
}

const KEYS=Object.keys(D.C),norm=s=>String(s||'').replace(/[^a-z]/gi,'').toLowerCase(),KMAP=Object.fromEntries(KEYS.map(k=>[norm(k),k]));
const U={A:[],cut:new Date().toLocaleDateString('en-CA'),mode:'date',file:'',at:''};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)};
const iso=d=>{d=new Date(d.getTime()+432e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const lab=s=>{s=String(s||'').toLowerCase();return s.includes('over 60')?5:s.includes('46 to 60')?4:s.includes('31 to 45')?3:s.includes('16 to 30')?2:s.includes('to 15')?1:0};
function stageOf(a){if(U.mode==='label')return lab(a.lab);const k=Math.round((new Date(U.cut+'T00:00:00')-new Date(a.svc+'T00:00:00'))/864e5);return k<0?0:k<=14?1:k<=29?2:k<=48?3:k<=63?4:5}
function build(){KEYS.forEach(k=>{D.C[k]=Array(10).fill(0);D.R[k]=Array(10).fill(0)});U.A.forEach(a=>{a.st=stageOf(a);if(!a.st)return;const r=D[a.seg][a.base];r[a.st*2-2]++;r[a.st*2-1]+=a.due})}
function save(){try{localStorage.setItem('zr_ar',JSON.stringify({A:U.A.map(({st,...a})=>a),cut:U.cut,mode:U.mode,file:U.file,at:U.at}))}catch(e){}}
function parse(wb){
  const A=[],seen=new Set();
  wb.SheetNames.forEach(n=>{
    const base=KMAP[norm(n)];if(!base)return;
    let seg=null,h=null;
    XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}).forEach(r=>{
      const t=r.slice(0,3).filter(Boolean).join(' ');
      if(/^\s*(residen|commercial)/i.test(t)){seg=/^\s*commercial/i.test(t)?'C':'R';return}
      if(r[0]&&norm(r[0])==='clientname'){h={};r.forEach((v,i)=>{if(v)h[norm(v)]=i});return}
      if(!h||!seg)return;
      const g=k=>h[k]==null?null:r[h[k]];
      const d=g('servicedate'),due=g('amountdue');
      if(!(d instanceof Date)||typeof due!=='number')return;
      const inv=g('invoicenumber'),key=base+'|'+inv;
      if(inv&&seen.has(key))return;seen.add(key);
      const lc=g('lastcontacted');
      A.push({base,seg,client:g('clientname'),company:g('companyname'),svc:iso(d),due,paid:+g('paidamount')||0,inv,status:g('accstatus')||g('accstattus'),lab:g('agingbucket'),last:lc instanceof Date?iso(lc):null});
    });
  });
  return A;
}
function insights(L,names){
  if(!L.length)return[];
  const o=[],S$=x=>x.reduce((s,a)=>s+a.due,0),T=S$(L)||1,p=x=>(S$(x)/T*100).toFixed(0)+'%';
  const top=[...L].sort((a,b)=>b.due-a.due).slice(0,5);
  o.push(`The 5 largest accounts add up to ${m0(S$(top))} (${p(top)} of the past-due amount). The largest is ${top[0].client} at ${m0(top[0].due)}.`);
  const crit=L.filter(a=>a.st>=4),nc=crit.filter(a=>!a.last);
  o.push(`${crit.length} accounts are over 45 days past due, totaling ${m0(S$(crit))} (${p(crit)}).`+(nc.length?` ${nc.length} of them (${m0(S$(nc))}) have no last-contact date.`:''));
  const ns=L.filter(a=>a.st>=3&&!a.status);
  if(ns.length)o.push(`${ns.length} accounts over 30 days (${m0(S$(ns))}) have no status assigned.`);
  const lg=L.filter(a=>/legal|collection/i.test(a.status||''));
  if(lg.length)o.push(`${lg.length} accounts (${m0(S$(lg))}) are already in legal or collections.`);
  const pt=L.filter(a=>a.paid>0);
  if(pt.length)o.push(`${pt.length} accounts have partial payments totaling ${m0(pt.reduce((s,a)=>s+a.paid,0))}; past-due amounts shown are full invoiced totals, before those payments.`);
  const cm=L.filter(a=>a.seg==='C');
  o.push(`Commercial is ${p(cm)} of the past-due amount and Residential is ${p(L.filter(a=>a.seg==='R'))}.`);
  if(names){const by={};L.forEach(a=>by[a.base]=(by[a.base]||0)+a.due);const e=Object.entries(by).sort((x,y)=>y[1]-x[1]);if(e.length>2)o.push(`${e[0][0]} holds ${(e[0][1]/T*100).toFixed(0)}% of the total; together with ${e[1][0]} and ${e[2][0]} it reaches ${((e[0][1]+e[1][1]+e[2][1])/T*100).toFixed(0)}%.`)}
  return o;
}
function insCard(L,t,names){const o=insights(L,names);return o.length?`<div class="card"><h2>${t}</h2><ul class="ins">${o.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
function acctCard(l){
  const L=U.A.filter(a=>a.st>0&&a.base===l).sort((a,b)=>b.due-a.due).slice(0,10);
  if(!L.length)return '';
  return `<div class="card"><h2>Largest accounts</h2><div class="wrap"><table><thead><tr><th style="text-align:left">Client</th><th>Type</th><th>Amount</th><th>Stage</th><th>Status</th><th>Last contact</th></tr></thead><tbody>${L.map(a=>`<tr style="cursor:default"><td class="n">${esc(a.client)}${a.company?`<small style="display:block;font-weight:400;color:var(--mu)">${esc(a.company)}</small>`:''}</td><td>${a.seg==='C'?'Commercial':'Residential'}</td><td>${m(a.due)}</td><td style="background:color-mix(in srgb,var(${ST[a.st-1].c}) 55%,var(--sf));color:#10202c">${ST[a.st-1].k}</td><td>${esc(a.status||'—')}</td><td>${a.last||'No record'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function upCard(){
  const n=U.A.length;
  return `<div class="card"><h2>Upload the collections Excel file</h2>
  <div class="drop"><b>Choose your .xlsx file</b><span>The tabs for the 14 bases are read (Residential and Commercial tables); all other tabs are ignored. Everything is processed in your browser.</span><input type="file" id="fx" accept=".xlsx,.xls"></div>
  <div class="opts"><label>Cutoff date<input type="date" id="fc" value="${U.cut}"></label>
  <label>How to calculate the stage<select id="fm"><option value="date" ${U.mode==='date'?'selected':''}>By service date</option><option value="label" ${U.mode==='label'?'selected':''}>Use the Aging bucket column</option></select></label></div>
  <p class="hint">${n?`Loaded: ${esc(U.file)} · ${n} accounts · ${U.A.filter(a=>a.st>0).length} past due · ${esc(U.at)}`:'No data loaded yet: the dashboard is showing sample data.'}</p>
  <p class="hint">By service date, using your dashboard ranges: 0–14, 15–29, 30–48, 49–63 and over 63 days before the cutoff date.</p>${n?'<button id="clr">Clear loaded data</button>':''}</div>`;
}
function bindUp(){
  const fx=$('#fx');if(!fx)return;
  fx.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const A=parse(XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}));
      if(!A.length)throw new Error('no accounts found in the base tabs');
      U.A=A;U.file=f.name;U.at=new Date().toLocaleString('en-US');
      const mt=f.name.match(/-_?([A-Za-z]{3})[a-z]*(\d{1,2})_+(\d{4})/),mo=mt?'JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(mt[1][0].toUpperCase()+mt[1].slice(1,3).toLowerCase())/3:-1;
      if(mo>=0&&mo%1===0)U.cut=mt[3]+'-'+String(mo+1).padStart(2,'0')+'-'+mt[2].padStart(2,'0');
      build();save();toast('Loaded '+A.length+' accounts');S.tab='dash';render();window.scrollTo(0,0);
    }catch(err){toast('Could not read the file: '+err.message)}
  };
  $('#fc').onchange=e=>{if(!e.target.value)return;U.cut=e.target.value;build();save();render()};
  $('#fm').onchange=e=>{U.mode=e.target.value;build();save();render()};
  const c=$('#clr');if(c)c.onclick=()=>{U.A=[];Object.assign(D,JSON.parse(JSON.stringify(SAMPLE)));try{localStorage.removeItem('zr_ar')}catch(e){}render()};
}

function load(){
  return upCard();
}

function render(){
  nav();
  $('#app').innerHTML=S.tab==='dash'?dash():S.tab==='base'?base():load();
  bindSeg();
  document.querySelectorAll('tbody tr[data-l]').forEach(r=>r.onclick=()=>{S.tab='base';S.loc=r.dataset.l;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-go]').forEach(r=>r.onclick=()=>{S.loc=r.dataset.go;render();window.scrollTo(0,0)});
  bindUp();const f=$('#f');
  if(f)f.onsubmit=e=>{
    e.preventDefault();
    const a=D[$('#fg').value][$('#fl').value],i=+$('#fs').value*2;
    a[i]+=+$('#fn').value||0;a[i+1]+=+$('#fd').value||0;
    const t=$('#toast');t.textContent='Cuenta guardada en '+$('#fl').value;t.style.display='block';
    setTimeout(()=>t.style.display='none',2200);
  };
}
$('#menu').onclick=()=>$('.shell').classList.toggle('open');
try{const s=JSON.parse(localStorage.getItem('zr_ar')||'null');if(s&&s.A&&s.A.length){Object.assign(U,s);build()}}catch(e){}
render();
</script>
